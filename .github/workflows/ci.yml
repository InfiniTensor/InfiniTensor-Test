name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[full]"
          pip install pytest pytest-cov
      - name: Unit tests
        run: pytest tests/unit/ -v --no-header

  integration-smoke:
    name: Integration smoke (CPU)
    runs-on: ubuntu-latest
    # This job needs InfiniTensor built. In real CI you'd first run a build job.
    # For now, the test gracefully skips if InfiniTensor is unavailable.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[full]"
          # Build a CPU-only InfiniTensor (placeholder - the real build is documented in README)
      - name: Collect smoke models
        run: |
          infinitensor-test-collect --sources synthetic_shape synthetic_elementwise synthetic_matmul
      - name: Run smoke tests
        run: |
          pytest tests/integration/test_op_subset.py -v -m "not slow"
