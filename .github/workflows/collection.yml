name: Collection foundation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  collection:
    name: Base installation / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest tests/unit tests/operators -q
      - name: Collect and reuse a valid offline subset without model extras
        run: |
          infinitensor-test-collect --sources synthetic_activation --name-glob 'synth_Relu*' --limit 2 --offline --data-dir .validation/ci
          infinitensor-test-collect --sources synthetic_activation --name-glob 'synth_Relu*' --limit 2 --offline --data-dir .validation/ci
