name: Real network sources

on:
  pull_request:
    branches: [master, main]
    paths: ['src/**', 'tests/**', 'configs/**', 'catalogs/**', 'pyproject.toml', '.github/workflows/model-sources.yml']
  push:
    branches: [master, main]
    paths: ['src/**', 'tests/**', 'configs/**', 'catalogs/**', 'pyproject.toml', '.github/workflows/model-sources.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed CPU export environment
        run: |
          python -m pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[networks,test]' -c configs/constraints-networks.txt
          python -m pip check
      - name: Check all source adapters and PyTorch/ONNX parity
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m pytest tests/unit tests/operators -q --junitxml=.validation/network-tests.xml
          infinitensor-test-expand --manifest configs/network-source-smoke.json --data-dir .validation/source-smoke --offline --minimum-real-models 3 --max-size-mb 160 --jobs 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-network-source-evidence
          include-hidden-files: true
          path: |
            .validation/network-tests.xml
            .validation/source-smoke/expansion/inventory.json
            .validation/source-smoke/expansion/results.json
            .validation/source-smoke/expansion/batches/**/worker-*.log

  diverse-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed CPU multi-task environment
        run: |
          python -m pip install torch==2.9.1 torchvision==0.24.1 torchaudio==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[diverse,test]' -c configs/constraints-diverse.txt
          python -m pip check
      - name: Validate real multi-task networks and input contracts
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m pytest tests/integration/test_diverse_sources.py -q --junitxml=.validation/diverse-tests.xml
          infinitensor-test-expand --manifest configs/diverse-source-smoke.json --data-dir .validation/diverse-smoke --offline --minimum-real-models 6 --max-size-mb 768 --jobs 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diverse-network-source-evidence
          include-hidden-files: true
          path: |
            .validation/diverse-tests.xml
            .validation/diverse-smoke/expansion/inventory.json
            .validation/diverse-smoke/expansion/results.json
            .validation/diverse-smoke/expansion/batches/**/worker-*.log

  paddle-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent CPU Paddle environment
        run: |
          python -m pip install -e '.[paddle,test]' -c configs/constraints-paddle.txt
          python -m pip check
          infinitensor-test-paddle-setup --directory .validation/paddle-repos
      - name: Validate Paddle exports and four real tasks
        env:
          ITEST_PADDLE_REPOS_DIR: ${{ github.workspace }}/.validation/paddle-repos
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m pytest tests/integration/test_paddle_exports.py -q --junitxml=.validation/paddle-tests.xml
          infinitensor-test-expand --manifest configs/paddle-source-smoke.json --data-dir .validation/paddle-smoke --offline --minimum-real-models 4 --max-size-mb 768 --jobs 2 --timeout 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paddle-network-source-evidence
          include-hidden-files: true
          path: |
            .validation/paddle-tests.xml
            .validation/paddle-smoke/expansion/inventory.json
            .validation/paddle-smoke/expansion/results.json
            .validation/paddle-smoke/expansion/batches/**/worker-*.log
