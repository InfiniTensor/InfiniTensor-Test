name: Real network sources

on:
  pull_request:
    branches: [master, main]
    paths: ['src/**', 'tests/**', 'configs/**', 'pyproject.toml', '.github/workflows/model-sources.yml']
  push:
    branches: [master, main]
    paths: ['src/**', 'tests/**', 'configs/**', 'pyproject.toml', '.github/workflows/model-sources.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed CPU export environment
        run: |
          python -m pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[networks,test]' -c configs/constraints-networks.txt
          python -m pip check
      - name: Check all source adapters and PyTorch/ONNX parity
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m pytest tests/unit tests/operators -q --junitxml=.validation/network-tests.xml
          infinitensor-test-expand --manifest configs/network-source-smoke.json --data-dir .validation/source-smoke --offline --minimum-real-models 3 --max-size-mb 160 --jobs 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-network-source-evidence
          include-hidden-files: true
          path: |
            .validation/network-tests.xml
            .validation/source-smoke/expansion/inventory.json
            .validation/source-smoke/expansion/results.json
            .validation/source-smoke/expansion/batches/**/worker-*.log
