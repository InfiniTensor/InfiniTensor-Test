# Default configuration for InfiniTensor-Test
# Override any of these in config.local.yaml (which is gitignored).

# Relative data_dir is resolved from cwd; relative children preserve subpaths.
data_dir: data
models_dir: models
results_dir: results
reports_dir: reports

# Where to find the InfiniTensor Python bindings (built locally)
infinitensor_python_path: ../InfiniTensor/pyinfinitensor/src
env_script: null
venv_path: null

# Skip models larger than 80MB when collecting
max_model_size_bytes: 83886080  # 80 MB

backend: cuda
default_suite: smoke
num_workers: 1
random_seed: 42
inference_timeout_s: 60
reference_runtime: onnxruntime
network_enabled: true
